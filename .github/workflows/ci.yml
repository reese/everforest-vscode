name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24]

    env:
      NODE_ENV: test
      # CI only lints and packages; it never launches a browser. Skip the
      # multi-hundred-MB Chromium download that @vscode/test-web's
      # @playwright/browser-chromium dependency runs on install, which
      # otherwise stalls `npm ci` indefinitely on a fresh runner.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - name: Check out ref
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node modules
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Package
        run: npm run package
